plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.com.american.agrotech'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.com.american.agrotech'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def storePath = System.getenv('AMERICAN_KEYSTORE_PATH')
            if (storePath) {
                storeFile file(storePath)
                storePassword System.getenv('AMERICAN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AMERICAN_KEY_ALIAS')
                keyPassword System.getenv('AMERICAN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('AMERICAN_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
}
